[workspace]
resolver = "2"
members = [
    "crates/caliber-common",
    "crates/caliber-db",
    "crates/caliber-user",
    "crates/caliber-server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
caliber-common = { path = "crates/caliber-common" }
caliber-db = { path = "crates/caliber-db" }
caliber-user = { path = "crates/caliber-user" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
axum = { version = "0.8", features = ["json", "query"] }
tower = "0.5"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
futures = "0.3"
bytes = "1"
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["set-header"] }
rpassword = "7"
libc = "0.2"

[profile.release]
lto = "thin"
