name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# package.json declares no engines field, so the pinned lane is fixed here.
env:
  BUN_PINNED: "1.2.x"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ["1.2.x", "latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun (${{ matrix.bun }})
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install reader utilities (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install reader utilities (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run release checks
        run: bun run check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"
      - name: Install reader utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils curl
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packed artifact
        run: bun run build
      - name: Start production server and smoke-test
        run: |
          export SMOKE_DIR="$(mktemp -d)"
          export CALIBRE_LIBRARY_PATH="$SMOKE_DIR/library"
          export CALIBER_CONFIG_DIR="$SMOKE_DIR/config"
          export PORT=3099
          export NODE_ENV=production
          mkdir -p "$CALIBRE_LIBRARY_PATH"
          bun src/index.ts > "$SMOKE_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "--- /api/health ---"
          curl -fsS "http://127.0.0.1:$PORT/api/health"
          echo
          echo "--- /opds ---"
          curl -fsS "http://127.0.0.1:$PORT/opds" | head -c 500
          echo
          echo "--- /api/user/me (auth) ---"
          curl -fsS "http://127.0.0.1:$PORT/api/user/me"
          echo
          kill $SERVER_PID
          trap - EXIT
