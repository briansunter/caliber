[package]
name = "caliber-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caliber HTTP server: JSON API, OPDS feeds, file/media streaming, SPA hosting."

[dependencies]
caliber-common = { workspace = true }
caliber-db = { workspace = true }
caliber-user = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
zip = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
rpassword = { workspace = true }

[[bin]]
name = "caliber-server"
path = "src/main.rs"

[[bin]]
name = "caliber-cli"
path = "src/bin/caliber-cli.rs"

[[bin]]
name = "caliber-mcp"
path = "src/bin/caliber-mcp.rs"

[dev-dependencies]
tempfile = "3"
